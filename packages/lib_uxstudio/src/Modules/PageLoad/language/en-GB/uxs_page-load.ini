UXS_PAGE_LOAD_NAME="Page Load"
UXS_PAGE_LOAD_DESC="Measures how fast pages load for real visitors (Navigation Timing, paint and layout metrics) and lists the slowest pages."
UXS_PAGE_LOAD_WIDGET_TEXT="median load time (%d samples, 7 days)"
UXS_PAGE_LOAD_SAMPLE_RATE="Share of page views measured (%)"
UXS_PAGE_LOAD_SAMPLE_RATE_HELP="0 turns measuring off. 10 means every tenth visit sends one sample, which is plenty for a small site; use more on a site with little traffic."
UXS_PAGE_LOAD_VITALS="Measure LCP and layout shift"
UXS_PAGE_LOAD_VITALS_HELP="Also records the largest contentful paint and cumulative layout shift (Core Web Vitals) in browsers that support them."
UXS_PAGE_LOAD_SKIP_LOGGED_IN="Skip logged-in users"
UXS_PAGE_LOAD_SKIP_LOGGED_IN_HELP="Editors see pages without the page cache and with extra toolbars, which would skew the numbers."
UXS_PAGE_LOAD_SLOW_MS="Slow page limit (ms)"
UXS_PAGE_LOAD_SLOW_MS_HELP="Load time above which a page counts as slow (twice as much is very slow). Used for colors and the overview card."
UXS_PAGE_LOAD_RETENTION_DAYS="Keep samples (days)"
UXS_PAGE_LOAD_RETENTION_DAYS_HELP="Older samples are deleted automatically."
