UXS_ANALYTICS_EXCLUDE_PATHS="Vyloučené stránky"
UXS_ANALYTICS_EXCLUDE_PATHS_HELP="Jedna řádka = začátek adresy (například /kosik) nebo vzor s * (například /soukrome/*). Odpovídající stránky se nepočítají. Administrace se nepočítá nikdy."
UXS_ANALYTICS_RETENTION="Uchovávat denní statistiky (dnů)"
