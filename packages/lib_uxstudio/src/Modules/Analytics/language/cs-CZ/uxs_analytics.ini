UXS_ANALYTICS_NAME="Statistiky návštěvnosti"
UXS_ANALYTICS_DESC="Vlastní měření návštěvnosti bez cookies (v souladu s GDPR): zobrazení stránek, unikátní návštěvníci, nejčtenější stránky, zdroje, zařízení a graf posledních dnů. Neukládají se žádné osobní údaje."
UXS_ANALYTICS_EXCLUDE_STAFF="Nepočítat administrátory"
UXS_ANALYTICS_EXCLUDE_STAFF_HELP="Návštěvy přihlášených uživatelů, kteří mohou spravovat UX Studio, se nezapočítávají, aby vaše vlastní procházení nezkreslovalo čísla."
UXS_ANALYTICS_FILTER_BOTS="Vyřazovat roboty"
UXS_ANALYTICS_FILTER_BOTS_HELP="Vyhledávací roboti, monitorovací nástroje, skripty a náhledy odkazů se nepočítají."
UXS_ANALYTICS_RESPECT_DNT="Respektovat Do Not Track"
UXS_ANALYTICS_RESPECT_DNT_HELP="Návštěvníci, jejichž prohlížeč posílá signál Do Not Track, se nepočítají. Měření je beze cookies a anonymní tak jako tak, takže je to volitelné."
UXS_ANALYTICS_TRUST_PROXY="Web běží za proxy nebo CDN"
