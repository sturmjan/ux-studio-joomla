UXS_ANALYTICS_NAME="Visitor Statistics"
UXS_ANALYTICS_DESC="Own cookie-free traffic measurement (GDPR-friendly): page views, unique visitors, top pages, sources, devices and a chart of the last days. No personal data is stored."
UXS_ANALYTICS_EXCLUDE_STAFF="Do not count administrators"
UXS_ANALYTICS_EXCLUDE_STAFF_HELP="Visits of logged-in users who can manage UX1 Studio are not counted, so your own browsing does not distort the numbers."
UXS_ANALYTICS_FILTER_BOTS="Filter out robots"
UXS_ANALYTICS_FILTER_BOTS_HELP="Search engine crawlers, monitoring tools, scripts and link previews are not counted."
UXS_ANALYTICS_RESPECT_DNT="Respect Do Not Track"
UXS_ANALYTICS_RESPECT_DNT_HELP="Visitors whose browser sends the Do Not Track signal are not counted. The measurement is cookie-free and anonymous anyway, so this is optional."
UXS_ANALYTICS_TRUST_PROXY="The site runs behind a proxy or CDN"
UXS_ANALYTICS_TRUST_PROXY_HELP="Turn on only when a proxy (for example Cloudflare) sits in front of the site. The visitor IP and country are then taken from its headers. Without a proxy leave it off, otherwise the headers could be forged."
UXS_ANALYTICS_EXCLUDE_PATHS="Excluded pages"
UXS_ANALYTICS_EXCLUDE_PATHS_HELP="One address start per line (for example /cart), or a pattern with * (for example /private/*). Matching pages are not counted. The administration is never counted."
UXS_ANALYTICS_RETENTION="Keep daily statistics for (days)"
UXS_ANALYTICS_RETENTION_HELP="Older daily summaries are deleted automatically. 0 keeps them forever."
UXS_ANALYTICS_JOB_ROLLUP="Visitor statistics: daily aggregation"
UXS_ANALYTICS_JOB_GEOIP="Visitor statistics: refresh country database"
UXS_ANALYTICS_WIDGET_TITLE="Visitors today"
UXS_ANALYTICS_WIDGET_TEXT="%d page views"
UXS_ANALYTICS_ERR_ACTION="Unknown action."
UXS_ANALYTICS_ERR_GEOIP="Downloading the country database failed: %s"
