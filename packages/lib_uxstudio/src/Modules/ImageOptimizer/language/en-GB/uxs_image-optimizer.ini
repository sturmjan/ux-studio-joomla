UXS_IMAGE_OPTIMIZER_NAME="Image optimizer"
UXS_IMAGE_OPTIMIZER_DESC="Compresses JPEG and PNG images on upload to the Media Manager, creates WebP and AVIF versions, optimizes existing images in batches and keeps the originals."
UXS_IMAGE_OPTIMIZER_JOB_BULK="Optimize images (one batch)"
UXS_IMAGE_OPTIMIZER_WIDGET_TEXT="optimized images, space saved (%d images)"
UXS_IMAGE_OPTIMIZER_ERR_PATH="This is not an image path the optimizer may work with."
UXS_IMAGE_OPTIMIZER_ERR_NO_BACKUP="There is no backup of the original, so the image cannot be restored or optimized again from the original."
UXS_IMAGE_OPTIMIZER_ERR_READ="The file could not be read."
UXS_IMAGE_OPTIMIZER_ERR_WRITE="The file could not be written. Check the permissions of the folder."
UXS_IMAGE_OPTIMIZER_SECTION_COMPRESSION="Compression"
UXS_IMAGE_OPTIMIZER_SECTION_FORMATS="WebP and AVIF"
UXS_IMAGE_OPTIMIZER_SECTION_AUTOMATION="Automation"
UXS_IMAGE_OPTIMIZER_JPEG_QUALITY="JPEG quality"
UXS_IMAGE_OPTIMIZER_JPEG_QUALITY_HELP="1-100, higher means a larger file. 80-85 is visually lossless for photos. PNG images are always compressed losslessly."
UXS_IMAGE_OPTIMIZER_MAX_WIDTH="Largest width (px)"
UXS_IMAGE_OPTIMIZER_MAX_WIDTH_HELP="Wider images are scaled down (never up). 0 turns scaling off."
UXS_IMAGE_OPTIMIZER_MAX_HEIGHT="Largest height (px)"
UXS_IMAGE_OPTIMIZER_MAX_HEIGHT_HELP="Taller images are scaled down, proportions are kept. 0 means no height limit."
UXS_IMAGE_OPTIMIZER_MIN_SIZE="Skip files smaller than (kB)"
UXS_IMAGE_OPTIMIZER_MIN_SIZE_HELP="Icons and tiny images gain nothing. 0 processes everything."
UXS_IMAGE_OPTIMIZER_KEEP_BACKUP="Keep the originals"
UXS_IMAGE_OPTIMIZER_KEEP_BACKUP_HELP="Saves the untouched file to media/uxstudio-originals/ (closed to the web) so an image can be restored. Needs disk space."
UXS_IMAGE_OPTIMIZER_LIBRARY="Image library"
UXS_IMAGE_OPTIMIZER_LIBRARY_HELP="Automatic prefers Imagick and falls back to GD."
UXS_IMAGE_OPTIMIZER_LIBRARY_AUTO="Automatic"
UXS_IMAGE_OPTIMIZER_CONVERT_WEBP="Also create WebP"
UXS_IMAGE_OPTIMIZER_CONVERT_WEBP_HELP="Writes image.jpg.webp next to the image when it is smaller than the optimized file."
UXS_IMAGE_OPTIMIZER_WEBP_QUALITY="WebP quality"
UXS_IMAGE_OPTIMIZER_CONVERT_AVIF="Also create AVIF"
UXS_IMAGE_OPTIMIZER_CONVERT_AVIF_HELP="Smaller than WebP but slow to encode. Ignored when the server cannot encode AVIF."
UXS_IMAGE_OPTIMIZER_AVIF_QUALITY="AVIF quality"
UXS_IMAGE_OPTIMIZER_AVIF_QUALITY_HELP="AVIF looks the same as JPEG at a lower number."
UXS_IMAGE_OPTIMIZER_DELIVERY="Serve WebP / AVIF automatically"
UXS_IMAGE_OPTIMIZER_DELIVERY_HELP="Adds rewrite rules to images/.htaccess so browsers that accept WebP or AVIF get it for the same address. Apache and LiteSpeed only; removed when the module is turned off."
UXS_IMAGE_OPTIMIZER_AUTO="Optimize new uploads"
UXS_IMAGE_OPTIMIZER_AUTO_HELP="Compress every JPEG and PNG that is uploaded or edited in the Media Manager. Changing this applies from the next page load."
UXS_IMAGE_OPTIMIZER_BULK="Optimize existing images in the background"
UXS_IMAGE_OPTIMIZER_BULK_HELP="The Joomla scheduler processes the images folder in small batches until every image has been handled once. Each image is compressed only once."
UXS_IMAGE_OPTIMIZER_BULK_BATCH="Images per batch"
UXS_IMAGE_OPTIMIZER_BULK_BATCH_HELP="Processed every 15 minutes by the scheduler."
UXS_IMAGE_OPTIMIZER_EXCLUDE="Excluded folders"
UXS_IMAGE_OPTIMIZER_EXCLUDE_HELP="One folder per line, relative to images/ (for example banners or logos/print)."
