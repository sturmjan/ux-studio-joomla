UXS_PERFORMANCE_OPTIMIZATION_NAME="Performance Optimization"
UXS_PERFORMANCE_OPTIMIZATION_DESC="Speeds up the front end: lazy loading of images and iframes, deferred scripts, preconnect and preload hints, HTML minification, unneeded core assets and browser cache headers."
UXS_PERFORMANCE_OPTIMIZATION_WIDGET_TEXT="active optimizations"
UXS_PERFORMANCE_OPTIMIZATION_ERR_FETCH="The home page of the site could not be loaded for the check."
UXS_PERFORMANCE_OPTIMIZATION_ERR_CONFIRM="Confirm the change of .htaccess first."
UXS_PERFORMANCE_OPTIMIZATION_ERR_NOT_APACHE="This web server does not read .htaccess (it is not Apache or LiteSpeed). Add the cache headers to the server configuration instead."
UXS_PERFORMANCE_OPTIMIZATION_ERR_TTL="Unknown cache duration."
UXS_PERFORMANCE_OPTIMIZATION_ERR_WRITE="The .htaccess file could not be saved. Check its permissions."
UXS_PERFORMANCE_OPTIMIZATION_SECTION_IMAGES="Images and frames"
UXS_PERFORMANCE_OPTIMIZATION_SECTION_SCRIPTS="Scripts and assets"
UXS_PERFORMANCE_OPTIMIZATION_SECTION_HINTS="Preconnect and preload"
UXS_PERFORMANCE_OPTIMIZATION_SECTION_HTML="HTML"
UXS_PERFORMANCE_OPTIMIZATION_SECTION_CACHE="Browser cache"
UXS_PERFORMANCE_OPTIMIZATION_LAZY_IMAGES="Lazy-load images"
UXS_PERFORMANCE_OPTIMIZATION_LAZY_IMAGES_HELP="Adds loading=lazy and decoding=async to images that do not have it yet, so images below the fold load only when the visitor scrolls to them."
UXS_PERFORMANCE_OPTIMIZATION_LAZY_IFRAMES="Lazy-load iframes"
UXS_PERFORMANCE_OPTIMIZATION_LAZY_IFRAMES_HELP="Adds loading=lazy to embedded frames (videos, maps)."
UXS_PERFORMANCE_OPTIMIZATION_LAZY_SKIP="Images that stay eager"
UXS_PERFORMANCE_OPTIMIZATION_LAZY_SKIP_HELP="The first images of the page are usually visible immediately and must not be lazy. How many to skip (logo and hero image: 1-2)."
UXS_PERFORMANCE_OPTIMIZATION_LCP_PRIORITY="Prioritize the main image"
UXS_PERFORMANCE_OPTIMIZATION_LCP_PRIORITY_HELP="Adds fetchpriority=high to the first sizeable image (not a logo or icon) so the browser fetches it early."
UXS_PERFORMANCE_OPTIMIZATION_LAZY_EXCLUDE="Never lazy-load (one text per line)"
UXS_PERFORMANCE_OPTIMIZATION_LAZY_EXCLUDE_HELP="An image or iframe whose tag contains any of these texts (a class name, part of the file name) is left alone."
UXS_PERFORMANCE_OPTIMIZATION_DEFER_SCRIPTS="Defer external scripts"
UXS_PERFORMANCE_OPTIMIZATION_DEFER_SCRIPTS_HELP="Adds defer to script tags with a src, so they stop blocking the page. Inline scripts that use a deferred library at once can stop working: list that library below and test the site."
UXS_PERFORMANCE_OPTIMIZATION_DEFER_EXCLUDE="Do not defer (one text per line)"
UXS_PERFORMANCE_OPTIMIZATION_DEFER_EXCLUDE_HELP="Scripts whose tag contains any of these texts keep loading synchronously. jQuery stays excluded by default because many inline scripts depend on it."
UXS_PERFORMANCE_OPTIMIZATION_REMOVE_MIGRATE="Remove jQuery Migrate"
UXS_PERFORMANCE_OPTIMIZATION_REMOVE_MIGRATE_HELP="jQuery Migrate only helps old code that uses removed jQuery features. Most current sites do not need it. Test the site after turning it on."
UXS_PERFORMANCE_OPTIMIZATION_DISABLE_ASSETS="Remove other assets (one per line)"
UXS_PERFORMANCE_OPTIMIZATION_DISABLE_ASSETS_HELP="Names of Joomla web assets that the front end should not load, e.g. script:bootstrap.es5 or style:fontawesome. Only for assets you know the site does not use."
UXS_PERFORMANCE_OPTIMIZATION_PRECONNECT="Preconnect to these origins (one per line)"
UXS_PERFORMANCE_OPTIMIZATION_PRECONNECT_HELP="Opens the connection to a third-party server early (fonts, analytics, CDN). Only https://host or http://host; for fonts and fetch requests add the word crossorigin after the address (for example https://fonts.gstatic.com crossorigin)."
UXS_PERFORMANCE_OPTIMIZATION_PRELOAD="Preload these files (one per line)"
UXS_PERFORMANCE_OPTIMIZATION_PRELOAD_HELP="Format: address, a space, then the kind: style, script, font, image or fetch (optionally a MIME type after it). The address starts with / (a path inside the site; a sub-folder install is added automatically) or http(s)://. Use it for fonts and the main image only."
UXS_PERFORMANCE_OPTIMIZATION_MINIFY_HTML="Minify HTML"
UXS_PERFORMANCE_OPTIMIZATION_MINIFY_HTML_HELP="Collapses the whitespace between tags. Scripts, styles, pre, textarea and attribute values stay untouched. Saves a few percent; Joomla gzip saves far more."
UXS_PERFORMANCE_OPTIMIZATION_STRIP_COMMENTS="Remove HTML comments"
UXS_PERFORMANCE_OPTIMIZATION_STRIP_COMMENTS_HELP="Conditional comments for old Internet Explorer are kept."
UXS_PERFORMANCE_OPTIMIZATION_CACHE_TTL="Cache duration of static files"
UXS_PERFORMANCE_OPTIMIZATION_CACHE_TTL_HELP="Used when you add the cache headers to .htaccess on the Overview tab. Nothing is written until you confirm it there."
UXS_PERFORMANCE_OPTIMIZATION_TTL_WEEK="1 week"
UXS_PERFORMANCE_OPTIMIZATION_TTL_MONTH="1 month"
UXS_PERFORMANCE_OPTIMIZATION_TTL_HALFYEAR="6 months"
UXS_PERFORMANCE_OPTIMIZATION_TTL_YEAR="1 year"
