UXS_PERFORMANCE_OPTIMIZATION_NAME="Optimalizace výkonu"
UXS_PERFORMANCE_OPTIMIZATION_DESC="Zrychluje web pro návštěvníky: líné načítání obrázků a iframů, odložené skripty, předpřipojení a přednačtení, minifikace HTML, nepotřebné assety jádra a cache hlavičky pro prohlížeč."
UXS_PERFORMANCE_OPTIMIZATION_WIDGET_TEXT="aktivních optimalizací"
UXS_PERFORMANCE_OPTIMIZATION_ERR_FETCH="Úvodní stránku webu se nepodařilo pro kontrolu načíst."
UXS_PERFORMANCE_OPTIMIZATION_ERR_CONFIRM="Nejdřív potvrďte úpravu souboru .htaccess."
UXS_PERFORMANCE_OPTIMIZATION_ERR_NOT_APACHE="Tento webový server .htaccess nečte (není to Apache ani LiteSpeed). Cache hlavičky přidejte do konfigurace serveru."
UXS_PERFORMANCE_OPTIMIZATION_ERR_TTL="Neznámá doba uložení v cache."
UXS_PERFORMANCE_OPTIMIZATION_ERR_WRITE="Soubor .htaccess se nepodařilo uložit. Zkontrolujte jeho oprávnění."
UXS_PERFORMANCE_OPTIMIZATION_SECTION_IMAGES="Obrázky a rámce"
UXS_PERFORMANCE_OPTIMIZATION_SECTION_SCRIPTS="Skripty a assety"
UXS_PERFORMANCE_OPTIMIZATION_SECTION_HINTS="Předpřipojení a přednačtení"
UXS_PERFORMANCE_OPTIMIZATION_SECTION_HTML="HTML"
UXS_PERFORMANCE_OPTIMIZATION_SECTION_CACHE="Cache prohlížeče"
UXS_PERFORMANCE_OPTIMIZATION_LAZY_IMAGES="Líné načítání obrázků"
UXS_PERFORMANCE_OPTIMIZATION_LAZY_IMAGES_HELP="Přidá k obrázkům bez nich atributy loading=lazy a decoding=async, takže se obrázky pod okrajem obrazovky načtou až při rolování."
UXS_PERFORMANCE_OPTIMIZATION_LAZY_IFRAMES="Líné načítání iframů"
UXS_PERFORMANCE_OPTIMIZATION_LAZY_IFRAMES_HELP="Přidá loading=lazy k vloženým rámcům (videa, mapy)."
UXS_PERFORMANCE_OPTIMIZATION_LAZY_SKIP="Obrázky, které se načtou hned"
UXS_PERFORMANCE_OPTIMIZATION_LAZY_SKIP_HELP="První obrázky stránky jsou obvykle vidět hned a líné být nesmí. Kolik jich přeskočit (logo a hlavní obrázek: 1-2)."
UXS_PERFORMANCE_OPTIMIZATION_LCP_PRIORITY="Upřednostnit hlavní obrázek"
UXS_PERFORMANCE_OPTIMIZATION_LCP_PRIORITY_HELP="Přidá fetchpriority=high k prvnímu většímu obrázku (ne logu ani ikoně), aby si ho prohlížeč vyžádal dřív."
UXS_PERFORMANCE_OPTIMIZATION_LAZY_EXCLUDE="Nikdy líně nenačítat (jeden text na řádek)"
UXS_PERFORMANCE_OPTIMIZATION_LAZY_EXCLUDE_HELP="Obrázek nebo iframe, jehož značka obsahuje některý z těchto textů (název třídy, část názvu souboru), zůstane beze změny."
UXS_PERFORMANCE_OPTIMIZATION_DEFER_SCRIPTS="Odložit externí skripty"
UXS_PERFORMANCE_OPTIMIZATION_DEFER_SCRIPTS_HELP="Přidá defer ke skriptům s adresou src, aby nebrzdily vykreslení stránky. Inline skripty, které hned používají odloženou knihovnu, mohou přestat fungovat: knihovnu uveďte níže a web otestujte."
UXS_PERFORMANCE_OPTIMIZATION_DEFER_EXCLUDE="Neodkládat (jeden text na řádek)"
UXS_PERFORMANCE_OPTIMIZATION_DEFER_EXCLUDE_HELP="Skripty, jejichž značka obsahuje některý z těchto textů, se načítají dál synchronně. jQuery je ve výchozím stavu vyřazeno, protože na něm závisí řada inline skriptů."
UXS_PERFORMANCE_OPTIMIZATION_REMOVE_MIGRATE="Odstranit jQuery Migrate"
UXS_PERFORMANCE_OPTIMIZATION_REMOVE_MIGRATE_HELP="jQuery Migrate pomáhá jen starému kódu, který používá odstraněné funkce jQuery. Většina současných webů ho nepotřebuje. Po zapnutí web otestujte."
UXS_PERFORMANCE_OPTIMIZATION_DISABLE_ASSETS="Odstranit další assety (jeden na řádek)"
UXS_PERFORMANCE_OPTIMIZATION_DISABLE_ASSETS_HELP="Názvy webových assetů Joomly, které se na webu nemají načítat, např. script:bootstrap.es5 nebo style:fontawesome. Jen pro assety, o kterých víte, že je web nepoužívá."
UXS_PERFORMANCE_OPTIMIZATION_PRECONNECT="Předpřipojit k těmto adresám (jedna na řádek)"
UXS_PERFORMANCE_OPTIMIZATION_PRECONNECT_HELP="Navrhne prohlížeči otevřít spojení s cizím serverem předem (písma, analytika, CDN). Jen ve tvaru https://server nebo http://server; pro písma a načítání přes fetch připište za adresu slovo crossorigin (například https://fonts.gstatic.com crossorigin)."
UXS_PERFORMANCE_OPTIMIZATION_PRELOAD="Předem načíst tyto soubory (jeden na řádek)"
UXS_PERFORMANCE_OPTIMIZATION_PRELOAD_HELP="Tvar: adresa, mezera a druh: style, script, font, image nebo fetch (za ním volitelně typ MIME). Adresa začíná / (cesta v rámci webu, i když web běží v podsložce - doplní se sama) nebo http(s)://. Používejte jen pro písma a hlavní obrázek."
UXS_PERFORMANCE_OPTIMIZATION_MINIFY_HTML="Minifikovat HTML"
UXS_PERFORMANCE_OPTIMIZATION_MINIFY_HTML_HELP="Sloučí bílé znaky mezi značkami. Skripty, styly, pre, textarea a hodnoty atributů zůstanou beze změny. Ušetří pár procent, gzip v Joomle ušetří mnohem víc."
UXS_PERFORMANCE_OPTIMIZATION_STRIP_COMMENTS="Odstranit HTML komentáře"
UXS_PERFORMANCE_OPTIMIZATION_STRIP_COMMENTS_HELP="Podmíněné komentáře pro starý Internet Explorer zůstanou."
UXS_PERFORMANCE_OPTIMIZATION_CACHE_TTL="Doba uložení statických souborů v cache"
UXS_PERFORMANCE_OPTIMIZATION_CACHE_TTL_HELP="Použije se při přidání cache hlaviček do .htaccess na kartě Přehled. Nic se nezapíše, dokud to tam nepotvrdíte."
UXS_PERFORMANCE_OPTIMIZATION_TTL_WEEK="1 týden"
UXS_PERFORMANCE_OPTIMIZATION_TTL_MONTH="1 měsíc"
UXS_PERFORMANCE_OPTIMIZATION_TTL_HALFYEAR="6 měsíců"
UXS_PERFORMANCE_OPTIMIZATION_TTL_YEAR="1 rok"
