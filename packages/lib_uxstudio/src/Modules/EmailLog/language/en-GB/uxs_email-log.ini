UXS_EMAIL_LOG_NAME="E-mail log"
UXS_EMAIL_LOG_DESC="Records every e-mail the site sends (including Joomla core mail such as password reset): recipient, subject, text, status and origin. Resend a message, export to CSV."
UXS_EMAIL_LOG_RETENTION="Retention (days)"
UXS_EMAIL_LOG_RETENTION_HELP="Log entries older than this are deleted daily. 0 keeps them forever."
UXS_EMAIL_LOG_STORE_BODY="Store the message text"
UXS_EMAIL_LOG_STORE_BODY_HELP="Keep the full text of every message so it can be read and resent. Turn off if messages contain data you do not want in the database (for example one-time links). Messages without a stored text cannot be resent."
UXS_EMAIL_LOG_DETECT_SOURCE="Detect the source"
UXS_EMAIL_LOG_DETECT_SOURCE_HELP="Record which extension sent each message. Adds a small overhead per message."
UXS_EMAIL_LOG_WIDGET="%d failed in the last 24 hours"
UXS_EMAIL_LOG_ERR_NOT_FOUND="Entry not found."
UXS_EMAIL_LOG_ERR_NO_BODY="This message has no stored text or recipient, so it cannot be resent."
UXS_EMAIL_LOG_ERR_RESEND="Resending failed."
UXS_EMAIL_LOG_RESENT="The e-mail was sent again."
UXS_EMAIL_LOG_RESEND_OF="resend of #%d"
UXS_EMAIL_LOG_MASK_SENSITIVE="Do not store the text of sensitive messages"
UXS_EMAIL_LOG_MASK_SENSITIVE_HELP="Messages from Joomla core with one-time codes and links (password reset, username reminder, MFA codes) are logged without their text. Otherwise anyone with read access to the database or backups could complete a pending password reset. Such a message cannot be resent."
