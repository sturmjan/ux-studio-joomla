UXS_EMAIL_LOG_NAME="Log e-mailů"
UXS_EMAIL_LOG_DESC="Zaznamenává každý e-mail, který web odešle (včetně systémových e-mailů Joomly, např. obnovy hesla): příjemce, předmět, text, stav a původce. Zprávu lze odeslat znovu, log exportovat do CSV."
UXS_EMAIL_LOG_RETENTION="Uchovávání (dny)"
UXS_EMAIL_LOG_RETENTION_HELP="Záznamy starší než tato doba se denně mažou. 0 = uchovávat navždy."
UXS_EMAIL_LOG_STORE_BODY="Ukládat text zprávy"
UXS_EMAIL_LOG_STORE_BODY_HELP="Uchová celý text každé zprávy, aby šel přečíst a odeslat znovu. Vypněte, pokud zprávy obsahují údaje, které nechcete mít v databázi (například jednorázové odkazy). Zprávu bez uloženého textu nelze odeslat znovu."
UXS_EMAIL_LOG_DETECT_SOURCE="Zjišťovat původce"
UXS_EMAIL_LOG_DETECT_SOURCE_HELP="Zaznamená, které rozšíření zprávu odeslalo. Mírně zvyšuje režii každé zprávy."
UXS_EMAIL_LOG_WIDGET="%d selhalo za posledních 24 hodin"
UXS_EMAIL_LOG_ERR_NOT_FOUND="Záznam nenalezen."
UXS_EMAIL_LOG_ERR_NO_BODY="Zpráva nemá uložený text nebo příjemce, proto ji nelze odeslat znovu."
UXS_EMAIL_LOG_ERR_RESEND="Opakované odeslání selhalo."
UXS_EMAIL_LOG_RESENT="E-mail byl odeslán znovu."
UXS_EMAIL_LOG_RESEND_OF="opakované odeslání #%d"
UXS_EMAIL_LOG_MASK_SENSITIVE="Neukládat text citlivých zpráv"
UXS_EMAIL_LOG_MASK_SENSITIVE_HELP="Zprávy z jádra Joomly s jednorázovými kódy a odkazy (obnovení hesla, připomenutí uživatelského jména, ověřovací kódy MFA) se zalogují bez textu. Kdo má čtecí přístup k databázi nebo zálohám, jinak může dokončit nevyřízené obnovení hesla. Takovou zprávu nelze odeslat znovu."
