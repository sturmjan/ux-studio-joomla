UXS_BOT_THROTTLE_NAME="Bot Throttle"
UXS_BOT_THROTTLE_DESC="Detects search engine, AI and SEO bots by User-Agent and throttles them with the server load, rate-limits abusive IPs and bans them, with notifications and an optional microcache."
UXS_BOT_THROTTLE_CAT_SEARCH_ENGINES="Search engines"
UXS_BOT_THROTTLE_CAT_AI_ASSISTANTS="AI assistants (real-time)"
UXS_BOT_THROTTLE_CAT_AI_TRAINING="AI training crawlers"
UXS_BOT_THROTTLE_CAT_SEO_TOOLS="SEO tools"
UXS_BOT_THROTTLE_CAT_SOCIAL="Social media"
UXS_BOT_THROTTLE_CAT_ARCHIVERS="Archivers"
UXS_BOT_THROTTLE_CAT_GENERIC="Generic crawlers"
UXS_BOT_THROTTLE_ACT_PASS="Always pass (no throttle)"
UXS_BOT_THROTTLE_ACT_MIN_DELAY="Pass with a minimal delay"
UXS_BOT_THROTTLE_ACT_LIGHT="Throttle lightly at YELLOW and above"
UXS_BOT_THROTTLE_ACT_AGGRESSIVE="Throttle aggressively"
UXS_BOT_THROTTLE_ACT_BLOCK="Block (429)"
UXS_BOT_THROTTLE_SEC_GENERAL="General"
UXS_BOT_THROTTLE_SEC_BOTS="Bot categories"
UXS_BOT_THROTTLE_SEC_LOAD="Load and delays"
UXS_BOT_THROTTLE_SEC_LISTS="Allow and block lists"
UXS_BOT_THROTTLE_F_IP_SOURCE="Client IP source"
UXS_BOT_THROTTLE_F_IP_SOURCE_HELP="Forwarded headers are trusted only from Cloudflare or your own proxies, so a visitor cannot fake an address to escape the limit. Inherit takes the setting of the Security optimization module."
UXS_BOT_THROTTLE_IP_INHERIT="Same as Security optimization"
UXS_BOT_THROTTLE_IP_NONE="Direct connection"
UXS_BOT_THROTTLE_IP_CLOUDFLARE="Behind Cloudflare"
UXS_BOT_THROTTLE_IP_XFF="Behind a reverse proxy (X-Forwarded-For)"
UXS_BOT_THROTTLE_F_TRUSTED="Trusted proxies"
UXS_BOT_THROTTLE_F_TRUSTED_HELP="Addresses or CIDR ranges of your own proxies, one per line."
UXS_BOT_THROTTLE_F_RDNS="Reverse-DNS verification"
UXS_BOT_THROTTLE_F_RDNS_HELP="Confirms that a User-Agent claiming to be Googlebot, Bingbot and so on really comes from that engine. Fakes are throttled as generic crawlers. Slightly slower the first time an address is seen."
UXS_BOT_THROTTLE_F_RPM="Hard limit per IP (requests per minute, 0 = off)"
UXS_BOT_THROTTLE_F_RPM_HELP="Safety net against floods, applied to every visitor who is not a logged-in manager, whether or not it is a known bot."
UXS_BOT_THROTTLE_F_BLOCK_CODE="Response when the limit is exceeded"
UXS_BOT_THROTTLE_CODE_429="429 Too Many Requests"
UXS_BOT_THROTTLE_CODE_503="503 Service Unavailable"
UXS_BOT_THROTTLE_F_BAN="Ban addresses that keep hitting the limit"
UXS_BOT_THROTTLE_F_BAN_HELP="An address that is refused too many times in ten minutes is banned for a while. Only a keyed hash of the address is stored, never the address itself."
UXS_BOT_THROTTLE_F_BAN_AFTER="Refused requests in 10 minutes before a ban"
UXS_BOT_THROTTLE_F_BAN_AFTER_HELP="Counted after the hard limit has been exceeded."
UXS_BOT_THROTTLE_F_BAN_MINUTES="Ban length (minutes)"
UXS_BOT_THROTTLE_F_NOTIFY="E-mail when an address is banned"
UXS_BOT_THROTTLE_F_NOTIFY_HELP="At most one e-mail per five minutes, so an attack from many addresses does not flood your inbox."
UXS_BOT_THROTTLE_F_NOTIFY_EMAIL="Notification e-mail"
UXS_BOT_THROTTLE_F_NOTIFY_EMAIL_HELP="Empty = the site e-mail address from the Joomla global configuration."
UXS_BOT_THROTTLE_F_MICROCACHE="Microcache for bots"
UXS_BOT_THROTTLE_F_MICROCACHE_HELP="Under load, bots get a stored copy of the page instead of a fresh render. Stored in cache/uxs-bot-cache (protected with a deny-all .htaccess; on nginx deny that folder in the server config). Humans never see it."
UXS_BOT_THROTTLE_F_RETENTION="Keep the log for (days)"
UXS_BOT_THROTTLE_F_REPORT_SECRET="Central report secret"
UXS_BOT_THROTTLE_F_REPORT_SECRET_HELP="Set the SAME value on every site managed by your UX1 Network app so it can recognise a repeat offender across sites without ever seeing the address (only a keyed hash is reported). Empty = bans stay local and are never reported."
UXS_BOT_THROTTLE_F_THRESHOLD_YELLOW="YELLOW threshold (load score)"
UXS_BOT_THROTTLE_F_THRESHOLD_ORANGE="ORANGE threshold (load score)"
UXS_BOT_THROTTLE_F_THRESHOLD_RED="RED threshold (load score)"
UXS_BOT_THROTTLE_F_MIN_DELAY_MS="Minimal delay (ms)"
UXS_BOT_THROTTLE_F_LIGHT_MIN="Light delay, shortest (ms)"
UXS_BOT_THROTTLE_F_LIGHT_MAX="Light delay, longest (ms)"
UXS_BOT_THROTTLE_F_AGGRESSIVE_MIN="Aggressive delay, shortest (ms)"
UXS_BOT_THROTTLE_F_AGGRESSIVE_MAX="Aggressive delay, longest (ms)"
UXS_BOT_THROTTLE_F_WL_UA="Allowed User-Agents (one per line)"
UXS_BOT_THROTTLE_F_WL_UA_HELP="Fragments of a User-Agent that are NEVER throttled."
UXS_BOT_THROTTLE_F_WL_IP="Allowed IP addresses / CIDR (one per line)"
UXS_BOT_THROTTLE_F_WL_IP_HELP="For example 192.168.0.0/16. These addresses are never treated as bots."
UXS_BOT_THROTTLE_F_BL_UA="Blocked User-Agents (one per line)"
UXS_BOT_THROTTLE_F_BL_UA_HELP="Fragments of a User-Agent that are ALWAYS throttled aggressively."
UXS_BOT_THROTTLE_MAIL_SUBJECT="[%s] Bot Throttle: an IP was banned"
UXS_BOT_THROTTLE_MAIL_BODY="An address sent far more requests than a normal visitor (%s) and was banned for %d minute(s). Only a keyed hash is stored, never the address itself, so it can be matched against server logs if needed.\n\n%s\n\nFurther bans within the next five minutes are logged but do not send another e-mail."
UXS_BOT_THROTTLE_JOB_CLEANUP="Bot Throttle cleanup"
UXS_BOT_THROTTLE_WIDGET="%d refused, load %s"
