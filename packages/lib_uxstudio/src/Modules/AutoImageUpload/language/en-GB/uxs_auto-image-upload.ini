UXS_AUTO_IMAGE_UPLOAD_ALT_PATTERN="Alt text"
UXS_AUTO_IMAGE_UPLOAD_ALT_PATTERN_HELP="Placeholders: %image_alt% (the alt text the image had), %title%, %alias%, %id%. The default keeps the existing alt text."
UXS_AUTO_IMAGE_UPLOAD_BASE_URL="Address of the saved images"
