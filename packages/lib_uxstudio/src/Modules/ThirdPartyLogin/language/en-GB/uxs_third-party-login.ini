UXS_THIRD_PARTY_LOGIN_NAME="Third-Party Login"
UXS_THIRD_PARTY_LOGIN_DESC="Sign in to the administration and the website with Google, Microsoft, Facebook, Seznam or any OpenID Connect provider (OAuth 2.0 with PKCE)."
UXS_THIRD_PARTY_LOGIN_SECTION_GENERAL="General"
UXS_THIRD_PARTY_LOGIN_ADMIN_LOGIN="Administrator login"
UXS_THIRD_PARTY_LOGIN_ADMIN_LOGIN_HELP="Show the buttons on the administrator login page and accept provider sign-in there."
UXS_THIRD_PARTY_LOGIN_SITE_LOGIN="Website login"
UXS_THIRD_PARTY_LOGIN_SITE_LOGIN_HELP="Show the buttons on the login form of the website (login module and login page)."
UXS_THIRD_PARTY_LOGIN_MATCH="Match existing accounts by e-mail"
UXS_THIRD_PARTY_LOGIN_MATCH_HELP="At the first sign-in a provider identity is paired with the Joomla account that has the same e-mail address, but only when the provider confirms that address. Turn off to sign in only identities linked by an administrator."
UXS_THIRD_PARTY_LOGIN_PRIVILEGED="Allow administrators and super users"
UXS_THIRD_PARTY_LOGIN_PRIVILEGED_HELP="Off by default: accounts that can manage users, extensions, templates or the configuration must use their password (and Joomla multi-factor authentication). Joomla multi-factor authentication is never skipped."
UXS_THIRD_PARTY_LOGIN_DOMAINS="Allowed e-mail domains"
UXS_THIRD_PARTY_LOGIN_DOMAINS_HELP="One domain per line or comma separated, for example example.com. Only identities with an e-mail address in these domains may sign in. Empty = any domain."
UXS_THIRD_PARTY_LOGIN_CREATE="Create accounts automatically"
UXS_THIRD_PARTY_LOGIN_CREATE_HELP="Off by default. When on, a verified identity without a Joomla account creates one. A group with administrative rights is never used."
UXS_THIRD_PARTY_LOGIN_CREATE_GROUP="Group of created accounts"
UXS_THIRD_PARTY_LOGIN_CREATE_GROUP_HELP="User group of new accounts. A group with administrative rights is refused at sign-in. The group must be allowed to log in to the application the visitor used."
UXS_THIRD_PARTY_LOGIN_ENABLE="Enable"
UXS_THIRD_PARTY_LOGIN_CLIENT_ID="Client ID"
UXS_THIRD_PARTY_LOGIN_CLIENT_ID_HELP="From the developer console of the provider. Register the redirect URIs shown on the Providers tab."
UXS_THIRD_PARTY_LOGIN_CLIENT_SECRET="Client secret"
UXS_THIRD_PARTY_LOGIN_CLIENT_SECRET_HELP="Stored encrypted and never shown again."
UXS_THIRD_PARTY_LOGIN_MS_TENANT="Tenant"
UXS_THIRD_PARTY_LOGIN_MS_TENANT_HELP="common (work and personal accounts), organizations, consumers (personal only), a tenant id or a domain. E-mail addresses of work accounts count as verified only when you limit sign-in to a single tenant; with common/organizations only personal Microsoft accounts can be matched by e-mail."
