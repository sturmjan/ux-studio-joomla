UXS_REDIRECTS_NAME="Redirect rules"
UXS_REDIRECTS_DESC="SEO-safe 301/302/307/308/410 redirects with regular expressions, chain and loop protection, a 404 log with redirect suggestions and CSV import/export."
UXS_REDIRECTS_WIDGET="redirect rules, %d logged 404 URLs"
UXS_REDIRECTS_GONE_MESSAGE="This page has been removed and is no longer available."
UXS_REDIRECTS_AUTO_NOTE="URL changed to %s"
UXS_REDIRECTS_JOB_CLEANUP="Redirects: trim the 404 log"

UXS_REDIRECTS_S_MONITOR="Redirect automatically when an article URL changes"
UXS_REDIRECTS_S_MONITOR_HELP="When a published article changes its alias or category, a 301 from the old address to the new one is created."
UXS_REDIRECTS_S_PASS_QUERY="Keep the query string"
UXS_REDIRECTS_S_PASS_QUERY_HELP="Carries ?utm_source, gclid and similar parameters over to the target so campaign tracking survives the redirect."
UXS_REDIRECTS_S_CACHE_TTL="Browser cache for permanent redirects (seconds)"
UXS_REDIRECTS_S_CACHE_TTL_HELP="Browsers cache a 301 forever unless told otherwise. 3600 keeps mistakes fixable; 0 = no caching."
UXS_REDIRECTS_S_TRACK_HITS="Count hits per rule"
UXS_REDIRECTS_S_TRACK_HITS_HELP="Shows which old URLs still get traffic (one small database write per redirect)."
UXS_REDIRECTS_S_LOG_404="Log 404 errors"
UXS_REDIRECTS_S_LOG_404_HELP="Aggregated per URL with hit count and referrer, no IP addresses."
UXS_REDIRECTS_S_RETENTION="Keep 404 entries for (days)"
UXS_REDIRECTS_S_RETENTION_HELP="Entries not seen for this long are removed. 0 = keep."

UXS_REDIRECTS_E_NOT_FOUND="Rule not found."
UXS_REDIRECTS_E_MATCH_TYPE="The match type must be exact or regex."
UXS_REDIRECTS_E_CODE="The code must be one of 301, 302, 307, 308, 410."
UXS_REDIRECTS_E_QUERY_MODE="The query string mode must be default, exact, ignore or pass."
UXS_REDIRECTS_W_QUERY_REGEX="Query string handling does not apply to regular expressions (they see path and query as one text) and was ignored."
UXS_REDIRECTS_E_SOURCE_REQUIRED="Source is required."
UXS_REDIRECTS_E_SOURCE_INVALID="Source is not a valid URL or path."
UXS_REDIRECTS_E_REGEX_INVALID="Source is not a valid regular expression."
UXS_REDIRECTS_E_REGEX_UNSAFE="Source regular expression is too slow (it backtracks catastrophically). Avoid nested repeats such as (a+)+."
UXS_REDIRECTS_E_QUERY_SOURCE="A source that names query parameters cannot ignore or pass on the query string. Use default or exact for it, or remove the parameters from the source."
UXS_REDIRECTS_E_SOURCE_HOME="The homepage itself cannot be redirected."
UXS_REDIRECTS_E_SOURCE_RESERVED="Joomla system paths (administrator, api, cli) cannot be redirected."
UXS_REDIRECTS_E_TARGET_REQUIRED="Target is required unless the code is 410."
UXS_REDIRECTS_E_TARGET_INVALID="Target must be a site path starting with a slash, an index.php?... route or an http(s) URL."
UXS_REDIRECTS_E_TARGET_TOO_LONG="The target is too long (at most 1900 characters)."
UXS_REDIRECTS_E_TARGET_PROTOCOL_RELATIVE="Protocol-relative targets (//host) are not allowed, use https://."
UXS_REDIRECTS_E_LOOP="This redirect would create a loop (the target leads back to the source)."
UXS_REDIRECTS_W_TARGET_GONE="The target itself is marked 410 Gone - pick a live page or use 410 for this source too."
UXS_REDIRECTS_W_CHAIN_FLATTENED="Target %1$s is itself redirected - pointed straight to %2$s to avoid a redirect chain."
UXS_REDIRECTS_W_HOMEPAGE="Redirecting to the homepage is treated as a soft 404 by Google. Prefer the closest matching page, or 410 when the content is gone."
UXS_REDIRECTS_W_TEMPORARY="Temporary redirect: search engines keep the old URL indexed and do not pass its ranking. Use 301/308 for permanent moves."
UXS_REDIRECTS_E_DUPLICATE="Another rule (#%d) already handles this source."
UXS_REDIRECTS_W_DUPLICATE_SKIPPED="Source already has a rule - skipped."
UXS_REDIRECTS_W_UPSTREAM="%d older rule(s) pointed at this source and were repointed to the new target (no chain)."

UXS_REDIRECTS_E_ITEMS="items must be a non-empty array."
UXS_REDIRECTS_E_IDS="Pass ids, or all=true to reset every counter."
UXS_REDIRECTS_E_CSV_EMPTY="CSV is empty."
UXS_REDIRECTS_E_CSV_BIG="CSV is too large (2 MB at most)."

UXS_REDIRECTS_AUDIT_INVALID_REGEX="Invalid regular expression - the rule never matches."
UXS_REDIRECTS_AUDIT_LOOP="Redirect loop."
UXS_REDIRECTS_AUDIT_CHAIN="Redirect chain with %d hops - each hop loses crawl budget; point straight at the final URL."
UXS_REDIRECTS_AUDIT_TEMPORARY_LONG="Temporary redirect older than 30 days - if the move is permanent, switch to 301 so the ranking is passed."
UXS_REDIRECTS_AUDIT_TARGET_BROKEN="Target answers HTTP %1$d after %2$d extra hop(s) - it must answer 200 directly."
UXS_REDIRECTS_AUDIT_HOMEPAGE_MASS="%d rules send visitors to the homepage. Google treats mass homepage redirects as soft 404s - map each URL to its closest page or use 410."
