UXS_PIXEL_TAG_MANAGER_NAME="Pixel & Tag Manager"
UXS_PIXEL_TAG_MANAGER_DESC="Add tracking pixels and tags (Google Analytics 4, Google Ads, Tag Manager, Meta Pixel, Microsoft Clarity, Pinterest, Seznam retargeting) to the site. Scripts load only after the visitor's consent."
UXS_PTM_SECTION_TAGS="Tags"
UXS_PTM_SECTION_CONSENT="Consent"
UXS_PTM_GROUP_GOOGLE="Google"
UXS_PTM_GROUP_META="Meta (Facebook, Instagram)"
UXS_PTM_GROUP_MICROSOFT="Microsoft"
UXS_PTM_GROUP_PINTEREST="Pinterest"
UXS_PTM_GROUP_SEZNAM="Seznam"
UXS_PTM_GA4_ID="Google Analytics 4 measurement ID"
UXS_PTM_GA4_ID_HELP="Starts with G- (for example G-ABCDE12345). Visits, sources and behaviour appear in your Google Analytics account. Needs the visitor's analytics consent. Do not enter the same ID in Tag Manager as well, visits would be counted twice."
UXS_PTM_ADS_ID="Google Ads conversion ID"
UXS_PTM_ADS_ID_HELP="Starts with AW- (for example AW-123456789). Measures ad conversions and builds remarketing lists. Needs the visitor's marketing consent."
UXS_PTM_GTM_ID="Google Tag Manager container ID"
UXS_PTM_GTM_ID_HELP="Starts with GTM- (for example GTM-ABC1234). The container can start any tag, so it is treated as marketing and loads only after marketing consent. The noscript fallback is deliberately not added, it cannot respect consent."
UXS_PTM_META_ID="Meta Pixel ID"
UXS_PTM_META_ID_HELP="The numeric Pixel ID from Meta Events Manager. Lets Meta measure ads and build audiences. Needs marketing consent."
UXS_PTM_CLARITY_ID="Microsoft Clarity project ID"
UXS_PTM_CLARITY_ID_HELP="The 10 character project ID from the Clarity dashboard (heatmaps and session recordings). Needs analytics consent."
UXS_PTM_PINTEREST_ID="Pinterest Tag ID"
UXS_PTM_PINTEREST_ID_HELP="The numeric Pinterest Tag ID. Measures Pinterest ads and conversions. Needs marketing consent."
UXS_PTM_SEZNAM_ID="Seznam retargeting ID"
UXS_PTM_SEZNAM_ID_HELP="The numeric retargeting ID from Sklik (Retargeting code). Needs marketing consent."
UXS_PTM_CONSENT_MODE="How is the visitor's consent read"
UXS_PTM_CONSENT_MODE_HELP="Tracking scripts are third-party scripts that need consent under the cookie rules (GDPR, ePrivacy). Choose where the consent comes from."
UXS_PTM_CONSENT_UXSTUDIO="UX Studio consent (recommended)"
UXS_PTM_CONSENT_COOKIE="Cookie of another consent tool"
UXS_PTM_CONSENT_OFF="Load always, without consent (not recommended)"
UXS_PTM_CONSENT_ANALYTICS_COOKIE="Analytics consent: cookie name"
UXS_PTM_CONSENT_ANALYTICS_MATCH="Analytics consent: cookie contains"
UXS_PTM_CONSENT_MARKETING_COOKIE="Marketing consent: cookie name"
UXS_PTM_CONSENT_MARKETING_MATCH="Marketing consent: cookie contains"
UXS_PTM_CONSENT_COOKIE_HELP="Name of the cookie your consent tool sets (see its documentation). Leave empty and the category is never allowed."
UXS_PTM_CONSENT_MATCH_HELP="Text that must appear in the cookie value when the visitor agreed (for example allow or marketing:true). Empty means that any value of the cookie is enough."
UXS_PTM_SKIP_STAFF="Do not track administrators"
UXS_PTM_SKIP_STAFF_HELP="Logged-in users who can manage UX Studio do not load the tracking scripts, so your own visits do not distort the data."
