UXS_CA_CONNECTOR_NAME="Central App connector"
UXS_CA_CONNECTOR_DESC="Connects this site to the UX1 Central App: pairing, signed health and security endpoints, single sign-on and the client for calls back to the Central App."
UXS_CA_CONNECTOR_SECTION_CONNECTION="Connection"
UXS_CA_CONNECTOR_SECTION_SSO="Single sign-on"
UXS_CA_CONNECTOR_URL="Central App address"
UXS_CA_CONNECTOR_URL_HELP="Leave empty for the production Central App (https://app.ux1.cz/). Plain http is accepted only for localhost."
UXS_CA_CONNECTOR_KEY="Shared API key"
UXS_CA_CONNECTOR_KEY_HELP="Generated when you press Connect and stored encrypted. It signs every request between this site and the Central App. Replace it only if you know the Central App holds the same value."
UXS_CA_CONNECTOR_ALLOWED_IPS="Allowed IP addresses"
UXS_CA_CONNECTOR_ALLOWED_IPS_HELP="Optional, one address per line. When filled in, only these addresses may call the Central App endpoint of this site (REMOTE_ADDR only, forwarded headers are ignored; behind a reverse proxy or Cloudflare that is the proxy address, so leave this empty there)."
UXS_CA_CONNECTOR_SSO_ADMIN="Allow single sign-on into administrator accounts"
UXS_CA_CONNECTOR_SSO_ADMIN_HELP="Logging in as a Super User or Administrator means being able to install code. Off by default: the Central App can then sign in only as accounts without installation rights. Turn on for sites you manage."
UXS_CA_CONNECTOR_SSO_PROVISION="Group for operators created automatically"
UXS_CA_CONNECTOR_SSO_PROVISION_HELP="An operator unknown to this site is created in this group (never an administrative one). The group must be allowed to sign in to the administration, otherwise the sign-in is refused."
UXS_CA_CONNECTOR_SSO_UA="Require the same browser"
UXS_CA_CONNECTOR_SSO_UA_HELP="The sign-in link works only in the browser the operator started it from (User-Agent hash)."
UXS_CA_CONNECTOR_SSO_IP="Require the same IP address"
UXS_CA_CONNECTOR_SSO_IP_HELP="Stricter, but breaks for operators behind changing addresses."
UXS_CA_CONNECTOR_SSO_TTL="Sign-in link validity (seconds)"
UXS_CA_CONNECTOR_SSO_TTL_HELP="The link works once and expires after this time."
UXS_CA_CONNECTOR_SSO_RATE="Sign-in links per operator and hour"
UXS_CA_CONNECTOR_SSO_RATE_HELP="Limit against abuse of a leaked key."
UXS_CA_CONNECTOR_JOB_UPDATES="Central App connector: check for Joomla and extension updates"
UXS_CA_CONNECTOR_WIDGET_PAIRED="Connected"
UXS_CA_CONNECTOR_WIDGET_NOT_PAIRED="Not connected"
UXS_CA_CONNECTOR_WIDGET_LAST="Last contact %s"
UXS_CA_CONNECTOR_ERR_URL="This is not an acceptable Central App address (use https, or http for localhost)."
UXS_CA_CONNECTOR_ERR_NO_KEY="The site has no API key yet. Press Connect first."
UXS_CA_CONNECTOR_ERR_NOT_JSON="The endpoint did not answer with JSON."
UXS_CA_CONNECTOR_SSO_FAILED="Sign-in from the Central App failed (%s)."
UXS_CA_CONNECTOR_SSO_STRATEGY="Mapping of Central App operators"
UXS_CA_CONNECTOR_SSO_STRATEGY_HELP="Automatic: match by e-mail, create the account when missing. Strict: only existing accounts with the same e-mail. Disabled: the Central App cannot sign in at all."
UXS_CA_CONNECTOR_SSO_STRATEGY_AUTO="Automatic (match by e-mail, create when missing)"
UXS_CA_CONNECTOR_SSO_STRATEGY_STRICT="Strict (existing accounts only)"
UXS_CA_CONNECTOR_SSO_STRATEGY_DISABLED="Disabled"
UXS_CA_CONNECTOR_WAITING="Waiting for the Central App to confirm the pairing."
