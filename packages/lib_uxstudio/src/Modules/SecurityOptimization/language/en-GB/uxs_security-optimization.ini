UXS_SECURITY_OPTIMIZATION_NAME="Security optimization"
UXS_SECURITY_OPTIMIZATION_DESC="Security headers, Content-Security-Policy, hidden version info, IP firewall with bans, login brute-force protection (lock-outs, optional Turnstile, optional secret administrator URL) and a Joomla hardening report."
UXS_SECURITY_OPTIMIZATION_SEC_FIREWALL="Firewall"
UXS_SECURITY_OPTIMIZATION_SEC_HEADERS="Headers and leaks"
UXS_SECURITY_OPTIMIZATION_SEC_CSP="Content-Security-Policy"
UXS_SECURITY_OPTIMIZATION_SEC_LOGIN="Login protection"
UXS_SECURITY_OPTIMIZATION_F_FIREWALL="Turn on the IP firewall"
UXS_SECURITY_OPTIMIZATION_F_FIREWALL_HELP="Blocks every request (website, administrator login, web services) from banned addresses and ranges, including the bans pushed by UX1 Network app. Loopback, allowlisted addresses and a logged-in super user are never blocked."
UXS_SECURITY_OPTIMIZATION_F_PROXY="Client IP source"
UXS_SECURITY_OPTIMIZATION_F_PROXY_HELP="Forwarded headers are trusted only in the selected mode and only when they come from the proxy itself, otherwise anyone could fake an address. Choose Cloudflare when the site is behind Cloudflare."
UXS_SECURITY_OPTIMIZATION_PROXY_NONE="Direct connection (no proxy)"
UXS_SECURITY_OPTIMIZATION_PROXY_CLOUDFLARE="Behind Cloudflare"
UXS_SECURITY_OPTIMIZATION_PROXY_XFF="Behind a reverse proxy (X-Forwarded-For)"
UXS_SECURITY_OPTIMIZATION_F_TRUSTED="Trusted proxies"
UXS_SECURITY_OPTIMIZATION_F_TRUSTED_HELP="Addresses or CIDR ranges of your own proxies or load balancers, one per line. Required for the reverse proxy mode; with Cloudflare they are added to the Cloudflare ranges."
UXS_SECURITY_OPTIMIZATION_F_ALLOWLIST="Allowlist (never block)"
UXS_SECURITY_OPTIMIZATION_F_ALLOWLIST_HELP="Addresses or CIDR ranges that are never blocked by the firewall, one per line."
UXS_SECURITY_OPTIMIZATION_F_MESSAGE="Message for blocked visitors"
UXS_SECURITY_OPTIMIZATION_F_MESSAGE_HELP="Shown on the 403 page. Empty = a short generic text."
UXS_SECURITY_OPTIMIZATION_F_HEADERS="Security headers"
UXS_SECURITY_OPTIMIZATION_F_HEADERS_HELP="Sends X-Content-Type-Options, X-Frame-Options and Referrer-Policy on every response."
UXS_SECURITY_OPTIMIZATION_F_HSTS="HSTS (Strict-Transport-Security)"
UXS_SECURITY_OPTIMIZATION_F_HSTS_HELP="Tells browsers to use HTTPS only for a year. Turn on only when the whole site works over HTTPS with a valid certificate."
UXS_SECURITY_OPTIMIZATION_F_PERMISSIONS="Permissions-Policy"
UXS_SECURITY_OPTIMIZATION_F_PERMISSIONS_HELP="Disables camera, microphone, geolocation, payment and USB for the site and embedded frames."
UXS_SECURITY_OPTIMIZATION_F_GENERATOR="Hide version information"
UXS_SECURITY_OPTIMIZATION_F_GENERATOR_HELP="Removes the generator meta tag and the X-Powered-By header. Files such as the manifests and README are static files of the web server: see the hardening report."
UXS_SECURITY_OPTIMIZATION_F_ENUM="Block user enumeration"
UXS_SECURITY_OPTIMIZATION_F_ENUM_HELP="Visitors who are not logged in get a 404 for author and user id query parameters (author, created_by, user_id of the profile view)."
UXS_SECURITY_OPTIMIZATION_F_CSP_MODE="Content-Security-Policy"
UXS_SECURITY_OPTIMIZATION_F_CSP_MODE_HELP="Report only sends the policy as a test and collects what it would block (see the CSP tab), nothing is blocked. Enforce blocks for real. CSP is never sent in the administrator. Start with Report only."
UXS_SECURITY_OPTIMIZATION_CSP_OFF="Off"
UXS_SECURITY_OPTIMIZATION_CSP_REPORT="Report only (test, blocks nothing)"
UXS_SECURITY_OPTIMIZATION_CSP_ENFORCE="Enforce (block disallowed sources)"
UXS_SECURITY_OPTIMIZATION_F_CSP_LEVEL="Strictness"
UXS_SECURITY_OPTIMIZATION_F_CSP_LEVEL_HELP="Basic allows inline scripts and eval() and works with most extensions. Strict removes eval() and allows only scripts that carry the page nonce, which Joomla stamps on the scripts it renders; inline scripts of extensions may need fixing."
UXS_SECURITY_OPTIMIZATION_CSP_BASIC="Basic (recommended)"
UXS_SECURITY_OPTIMIZATION_CSP_STRICT="Strict (nonce, no eval)"
UXS_SECURITY_OPTIMIZATION_F_CSP_PRESETS="Allowed services"
UXS_SECURITY_OPTIMIZATION_F_CSP_PRESETS_HELP="Tick the external services the site uses; their domains are added to the policy."
UXS_SECURITY_OPTIMIZATION_F_CSP_ALLOW="Custom allowed sources"
UXS_SECURITY_OPTIMIZATION_F_CSP_ALLOW_HELP="One host per line, for example https://cdn.example.com or https://*.example.com. Added to scripts, styles, images, fonts, connections, frames and media."
UXS_SECURITY_OPTIMIZATION_F_CSP_EXTRA="Extra directives"
UXS_SECURITY_OPTIMIZATION_F_CSP_EXTRA_HELP="One directive per line, for example: frame-ancestors 'self' https://partner.example.com. It replaces the generated directive of the same name."
UXS_SECURITY_OPTIMIZATION_F_LIMIT="Limit login attempts"
UXS_SECURITY_OPTIMIZATION_F_LIMIT_HELP="Locks an IP address out for a while after too many failed logins (administrator and site login)."
UXS_SECURITY_OPTIMIZATION_F_MAX="Failed attempts before a lock-out"
UXS_SECURITY_OPTIMIZATION_F_LOCK_TIME="Lock-out time (minutes)"
UXS_SECURITY_OPTIMIZATION_F_LOCK_TIME_HELP="Also the window in which failed attempts are counted."
UXS_SECURITY_OPTIMIZATION_F_PROGRESSIVE="Lengthen repeated lock-outs"
UXS_SECURITY_OPTIMIZATION_F_PROGRESSIVE_HELP="Every new lock-out of the same address within 24 hours lasts longer: the lock-out time is multiplied by the factor below, up to the maximum."
UXS_SECURITY_OPTIMIZATION_F_MULTIPLIER="Lock-out multiplier"
UXS_SECURITY_OPTIMIZATION_F_MAX_HOURS="Longest lock-out (hours)"
UXS_SECURITY_OPTIMIZATION_F_AUTOBAN_AFTER="Ban the address after this many lock-outs"
UXS_SECURITY_OPTIMIZATION_F_AUTOBAN_AFTER_HELP="When one address gets locked out this many times within 24 hours it is added to the IP bans for a longer time. 0 = never. Allowlisted addresses are never banned."
UXS_SECURITY_OPTIMIZATION_F_AUTOBAN_HOURS="Automatic ban length (hours)"
UXS_SECURITY_OPTIMIZATION_F_NOTIFY="E-mail on lock-out"
UXS_SECURITY_OPTIMIZATION_F_NOTIFY_HELP="At most one e-mail per five minutes."
UXS_SECURITY_OPTIMIZATION_F_NOTIFY_EMAIL="Notification e-mail"
UXS_SECURITY_OPTIMIZATION_F_NOTIFY_EMAIL_HELP="Empty = the site e-mail address from the Joomla global configuration."
UXS_SECURITY_OPTIMIZATION_F_SECRET="Secret administrator URL"
UXS_SECURITY_OPTIMIZATION_F_SECRET_HELP="Visitors who are not logged in get a 404 on /administrator/ unless they open it with the secret parameter. Save the URL shown on the overview first. Rescue: define UXSTUDIO_DISABLE_LOGIN_PROTECTION in administrator/defines.php."
UXS_SECURITY_OPTIMIZATION_F_SECRET_KEY="Secret parameter"
UXS_SECURITY_OPTIMIZATION_F_SECRET_KEY_HELP="4-40 letters, digits or underscore. The login is then at /administrator/index.php?your_parameter. An invalid value switches the gate off."
UXS_SECURITY_OPTIMIZATION_F_SECRET_BEHAVIOR="Without the secret"
UXS_SECURITY_OPTIMIZATION_SECRET_404="404 page"
UXS_SECURITY_OPTIMIZATION_SECRET_HOME="Redirect to the homepage"
UXS_SECURITY_OPTIMIZATION_F_TURNSTILE="Cloudflare Turnstile on the administrator login"
UXS_SECURITY_OPTIMIZATION_F_TURNSTILE_HELP="Adds a Turnstile check to /administrator/. Needs both keys from the Cloudflare dashboard. If Cloudflare cannot be reached the login stays open."
UXS_SECURITY_OPTIMIZATION_F_TURNSTILE_SITE="Turnstile site key"
UXS_SECURITY_OPTIMIZATION_F_TURNSTILE_SECRET="Turnstile secret key"
UXS_SECURITY_OPTIMIZATION_LOCKED="Too many failed login attempts. Try again in %d minute(s)."
UXS_SECURITY_OPTIMIZATION_CAPTCHA_FAILED="The verification check failed. Please try again."
UXS_SECURITY_OPTIMIZATION_MAIL_LOCKOUT_SUBJECT="[%s] Login lock-out"
UXS_SECURITY_OPTIMIZATION_MAIL_LOCKOUT_BODY="An address was locked out after repeated failed logins.\n\nIP address: %s\nLast user name: %s\nLock-out: %d minute(s)\nLock-outs in 24 hours: %d"
UXS_SECURITY_OPTIMIZATION_JOB_HOUSEKEEPING="Security optimization housekeeping"
UXS_SECURITY_OPTIMIZATION_WIDGET="%d active bans, %d lock-outs in 24 h"
UXS_SECURITY_OPTIMIZATION_CHECK_DEBUG="Debug mode is off"
UXS_SECURITY_OPTIMIZATION_CHECK_ERROR_REPORTING="Error reporting is not set to maximum or development"
UXS_SECURITY_OPTIMIZATION_CHECK_CONFIG_WRITABLE="configuration.php is read-only"
UXS_SECURITY_OPTIMIZATION_CHECK_INSTALLATION_DIR="The installation folder is gone"
UXS_SECURITY_OPTIMIZATION_CHECK_LEAKY_FILES="Version and CMS files are removed from the web root"
UXS_SECURITY_OPTIMIZATION_CHECK_FORCE_SSL="HTTPS is forced for the whole site"
UXS_SECURITY_OPTIMIZATION_CHECK_PHP_VERSION="PHP version is supported"
UXS_SECURITY_OPTIMIZATION_CHECK_SUPER_USERS="Few super users"
UXS_SECURITY_OPTIMIZATION_CHECK_SUPER_USERS_MFA="Every super user has multi-factor authentication"
