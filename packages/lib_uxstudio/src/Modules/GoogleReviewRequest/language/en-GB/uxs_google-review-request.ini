UXS_GOOGLE_REVIEW_REQUEST_NAME="Google Review Request"
UXS_GOOGLE_REVIEW_REQUEST_DESC="Send customers an e-mail asking for a Google review (one by one, in bulk or from your shop / booking system) and keep a log of what was sent."
UXS_GOOGLE_REVIEW_REQUEST_SECTION_MESSAGE="Message"
UXS_GOOGLE_REVIEW_REQUEST_SECTION_RULES="Rules"
UXS_GOOGLE_REVIEW_REQUEST_SECTION_AUTOMATION="Automation"
UXS_GOOGLE_REVIEW_REQUEST_URL="Google review link or Place ID"
UXS_GOOGLE_REVIEW_REQUEST_URL_HELP="Where customers write the review. Paste the link from Google Business Profile (Ask for reviews) or the Place ID (ChIJ...): a Place ID is turned into the write-review link automatically. Used as {review_url}."
UXS_GOOGLE_REVIEW_REQUEST_SUBJECT="E-mail subject"
UXS_GOOGLE_REVIEW_REQUEST_PLACEHOLDERS_HELP="You can use {name} (customer name), {site} (site name) {review_url} (review link) and {unsubscribe_url} (opt-out link; added automatically at the end if missing)."
UXS_GOOGLE_REVIEW_REQUEST_BODY="E-mail body"
UXS_GOOGLE_REVIEW_REQUEST_BODY_HELP="Use {review_url} where the review link should go, {unsubscribe_url} for the opt-out link (optional: a line is added automatically if missing), {name} for the customer name and {site} for the site name."
UXS_GOOGLE_REVIEW_REQUEST_SENDER_NAME="Sender name"
UXS_GOOGLE_REVIEW_REQUEST_SENDER_NAME_HELP="Optional. The address stays the site's one from Global Configuration."
UXS_GOOGLE_REVIEW_REQUEST_REPLY_TO="Reply-to address"
UXS_GOOGLE_REVIEW_REQUEST_REPLY_TO_HELP="Optional. Where replies of customers go."
UXS_GOOGLE_REVIEW_REQUEST_COOLDOWN="Do not ask the same address again for (days)"
UXS_GOOGLE_REVIEW_REQUEST_COOLDOWN_HELP="Protects customers from repeated requests. 0 = no limit."
UXS_GOOGLE_REVIEW_REQUEST_DAILY_LIMIT="Maximum requests per 24 hours"
UXS_GOOGLE_REVIEW_REQUEST_DAILY_LIMIT_HELP="Protects your mail reputation and hosting limits. 0 = no limit."
UXS_GOOGLE_REVIEW_REQUEST_BLOCKLIST="Never send to"
UXS_GOOGLE_REVIEW_REQUEST_BLOCKLIST_HELP="E-mail addresses or whole domains (example.com), separated by spaces, commas or new lines. Use it for customers who asked not to be contacted."
UXS_GOOGLE_REVIEW_REQUEST_RETENTION="Keep the log for (days)"
UXS_GOOGLE_REVIEW_REQUEST_RETENTION_HELP="The log contains e-mail addresses and names; older entries are deleted daily. 0 = keep forever."
UXS_GOOGLE_REVIEW_REQUEST_API_SECRET="Secret for automatic requests"
UXS_GOOGLE_REVIEW_REQUEST_API_SECRET_HELP="Lets a shop or booking system ask for a request by a signed call (HMAC). Empty or shorter than 16 characters = the endpoint is off. See the documentation of the module for the address and signature."
UXS_GOOGLE_REVIEW_REQUEST_DEFAULT_SUBJECT="How was your experience?"
UXS_GOOGLE_REVIEW_REQUEST_DEFAULT_BODY="Hi {name},<br><br>Thank you for choosing {site}! We would really appreciate it if you could take a moment to leave us a review: <a href='{review_url}'>{review_url}</a><br><br>Thank you!"
UXS_GOOGLE_REVIEW_REQUEST_DEFAULT_NAME="there"
