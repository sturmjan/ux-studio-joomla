UXS_EMAIL_HEALTH_NAME="E-mail health"
UXS_EMAIL_HEALTH_DESC="Sends a test e-mail to check the site can deliver mail, and checks the DNS of the sender domain (MX, SPF, DKIM, DMARC). Optional scheduled tests; the result is available to UX1 Network app."
UXS_EMAIL_HEALTH_SECTION_DNS="DNS check"
UXS_EMAIL_HEALTH_RECIPIENT="Test recipient"
UXS_EMAIL_HEALTH_RECIPIENT_HELP="Address that receives the test message. Blank uses the address of the administrator who starts the test, and the sender address of the site for scheduled tests."
UXS_EMAIL_HEALTH_AUTO_TEST="Scheduled test"
UXS_EMAIL_HEALTH_AUTO_TEST_HELP="Send a test e-mail automatically at a fixed interval. Needs the Joomla scheduler to run."
UXS_EMAIL_HEALTH_INTERVAL="Test interval"
UXS_EMAIL_HEALTH_EVERY_HOUR="Every hour"
UXS_EMAIL_HEALTH_EVERY_3H="Every 3 hours"
UXS_EMAIL_HEALTH_EVERY_6H="Every 6 hours"
UXS_EMAIL_HEALTH_EVERY_12H="Every 12 hours"
UXS_EMAIL_HEALTH_EVERY_DAY="Once a day"
UXS_EMAIL_HEALTH_DNS_DOMAIN="Domain to check"
UXS_EMAIL_HEALTH_DNS_DOMAIN_HELP="Blank checks the domain of the sender address the site really uses (after the SMTP e-mail override)."
UXS_EMAIL_HEALTH_DKIM_SELECTORS="Extra DKIM selectors"
UXS_EMAIL_HEALTH_DKIM_SELECTORS_HELP="Comma separated. DKIM selectors cannot be listed in DNS, so common ones are tried. Add the selector of your mail provider here if no key is found."
UXS_EMAIL_HEALTH_AUTO_DNS="Daily DNS check"
UXS_EMAIL_HEALTH_AUTO_DNS_HELP="Check the DNS records once a day (only DNS queries are made). Needs the Joomla scheduler to run."
UXS_EMAIL_HEALTH_JOB_TEST="E-mail health: scheduled test e-mail"
UXS_EMAIL_HEALTH_JOB_DNS="E-mail health: DNS check of the sender domain"
UXS_EMAIL_HEALTH_ERR_RECIPIENT="Enter a valid recipient e-mail address."
UXS_EMAIL_HEALTH_ERR_DOMAIN="Enter a valid domain name, for example example.com."
UXS_EMAIL_HEALTH_TEST_SUBJECT="[%1$s] E-mail health check - %2$s"
UXS_EMAIL_HEALTH_TEST_BODY="This is an automated test e-mail from %1$s.\nTime: %2$s\n\nIf you can read this, outgoing e-mail is working."
UXS_EMAIL_HEALTH_WIDGET_NONE="No test has been run yet"
UXS_EMAIL_HEALTH_WIDGET_OK="Sending works"
UXS_EMAIL_HEALTH_WIDGET_FAIL="Sending fails"
UXS_EMAIL_HEALTH_WIDGET_DNS="DNS: %s"
UXS_EMAIL_HEALTH_WIDGET_NO_DNS="DNS not checked yet"
UXS_EMAIL_HEALTH_STATUS_OK="in order"
UXS_EMAIL_HEALTH_STATUS_WARN="needs attention"
UXS_EMAIL_HEALTH_STATUS_BAD="problem"
UXS_EMAIL_HEALTH_STATUS_INFO="info"
UXS_EMAIL_HEALTH_MX_OK="Found %d mail server(s) for the domain."
UXS_EMAIL_HEALTH_MX_NONE_A="No MX record. Receivers fall back to the A record of the domain, which is rarely intended."
UXS_EMAIL_HEALTH_MX_NONE="No MX record: the domain cannot receive mail, so bounces and replies are lost."
UXS_EMAIL_HEALTH_SPF_OK="SPF record found and valid."
UXS_EMAIL_HEALTH_SPF_ISSUES="SPF record found, but it has issues."
UXS_EMAIL_HEALTH_SPF_NONE="No SPF record. Receivers cannot tell which servers may send mail for this domain, so your mail is more likely to land in spam."
UXS_EMAIL_HEALTH_SPF_MULTI="%d SPF records found. Receivers treat this as an error: merge them into one record."
UXS_EMAIL_HEALTH_SPF_NO_ALL="The record has no all mechanism, so it does not say what to do with other senders. End it with -all or ~all."
UXS_EMAIL_HEALTH_SPF_ALL_OPEN="The record ends with +all or ?all (or no qualifier), which allows or ignores any sender. Use -all or ~all."
UXS_EMAIL_HEALTH_SPF_SOFTFAIL="The record ends with ~all (soft fail). That is common; -all is stricter."
UXS_EMAIL_HEALTH_SPF_LOOKUPS="The record needs %d DNS lookups. The limit is 10; above it SPF fails for receivers. Remove unused include entries."
UXS_EMAIL_HEALTH_SPF_PTR="The ptr mechanism is discouraged by the SPF standard."
UXS_EMAIL_HEALTH_SPF_MISSING_PROVIDER="Mail is sent through a provider, but the SPF record does not mention %s."
UXS_EMAIL_HEALTH_DKIM_OK="DKIM key found for selector(s): %s."
UXS_EMAIL_HEALTH_DKIM_NONE="No DKIM key found for the tested selectors (%s). The selector depends on your mail provider: add it in the module settings if you know it."
UXS_EMAIL_HEALTH_DKIM_WEAK="The key of selector %s looks like a 1024-bit key; 2048-bit is recommended."
UXS_EMAIL_HEALTH_DKIM_REVOKED="The key of selector %s is empty (revoked)."
UXS_EMAIL_HEALTH_DMARC_NONE="No DMARC record. Without it receivers do not know what to do with mail that fails SPF and DKIM, and large mailbox providers increasingly require it."
UXS_EMAIL_HEALTH_DMARC_POLICY="DMARC record found, policy: %s."
UXS_EMAIL_HEALTH_DMARC_INHERITED="The record is published on the parent domain %s and applies to this domain."
UXS_EMAIL_HEALTH_DMARC_INVALID="The record has no valid policy (p=none, quarantine or reject)."
UXS_EMAIL_HEALTH_DMARC_P_NONE="Policy p=none only monitors. Once SPF and DKIM pass, move to quarantine or reject."
UXS_EMAIL_HEALTH_DMARC_NO_RUA="No reporting address (rua). You will not receive reports about who sends mail as your domain."
UXS_EMAIL_HEALTH_DMARC_PCT="The policy applies to only %d percent of the mail."
UXS_EMAIL_HEALTH_ERR_RATE="Too many attempts in a short time. Try again in %d s."
